# SPDX-License-Identifier: GPL-3.0-only
#
# Builds and tests Echo HUD on GitHub's own Windows machines.
#
# Why this exists: anyone can see that the program offered for download was
# produced from the source in this repository, by a neutral machine, using
# the same scripts contributors run locally. Nothing is built on a
# maintainer's PC.
#
#   every push and pull request -> build + tests; EchoHUD.exe is kept as a
#                                  downloadable "artifact" of that run
#   pushing a tag like v1.0.0   -> additionally prepares a DRAFT release with
#                                  EchoHUD.exe attached. A maintainer reviews
#                                  and publishes it by hand.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only by default; only the release job below may write.
permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Get the source
        uses: actions/checkout@v4

      - name: Build EchoHUD.exe
        shell: powershell
        run: ./scripts/build.ps1

      - name: Run the automated checks
        shell: powershell
        run: ./scripts/test.ps1

      - name: Show the file's SHA-256 fingerprint
        shell: powershell
        run: Get-FileHash artifacts/bin/EchoHUD.exe -Algorithm SHA256 | Format-List

      - name: Keep the program as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoHUD
          path: |
            artifacts/bin/EchoHUD.exe
            artifacts/bin/LICENSE
          if-no-files-found: error

  release:
    name: Prepare a draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write # needed to create the draft release
    steps:
      - name: Fetch the program built above
        uses: actions/download-artifact@v4
        with:
          name: EchoHUD
          path: release

      - name: Create the draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create $env:TAG release/EchoHUD.exe
          --repo $env:GITHUB_REPOSITORY
          --title "Echo HUD $($env:TAG.TrimStart('v'))"
          --draft
          --generate-notes
